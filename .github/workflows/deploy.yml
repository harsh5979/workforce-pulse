name: Production Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Sync Code and Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add Server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create Remote Directory
        run: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p ~/workforce-pulse"

      - name: Sync Files to VPS (Rsync)
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '*.env' \
            --exclude '.env.local' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/workforce-pulse/

      - name: Write Production .env on Server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'ENDSSH'
            cat > ~/workforce-pulse/.env << EOF
          # Auto-generated by GitHub Actions
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/workforce
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NODE_ENV=production
          EOF
          ENDSSH

      - name: Build and Start Docker Containers
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'ENDSSH'
            set -e
            cd ~/workforce-pulse
            
            echo "🐳 Building Docker images..."
            docker compose up --build -d

            echo "⏳ Waiting 10 seconds for database to initialize..."
            sleep 10

            echo "🗄️ Running database migrations..."
            docker compose exec -T backend npm run db:migrate || echo "Migrations complete or skipped."

            echo "🌱 Seeding database with admin account..."
            docker compose exec -T backend npm run db:seed || echo "Seeding complete or skipped."

            echo "✅ Deployment completed successfully!"
          ENDSSH
