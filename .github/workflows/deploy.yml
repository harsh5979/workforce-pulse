name: Deploy Workforce Pulse

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── CI: Type Check ───────────────────────────────────────────────
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install & check frontend
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit

      - name: Install & check backend
        run: |
          cd backend
          npm ci
          npx tsc --noEmit

  # ─── Deploy ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync repository to server
        run: |
          rsync -avz \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '*.env' \
            --exclude '.env.local' \
            --delete \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/workforce-pulse/

      - name: Write production .env on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'ENDSSH'
            cat > /opt/workforce-pulse/.env << EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/workforce
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          SITE_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NODE_ENV=production
          EOF
          ENDSSH

      - name: Build and deploy Docker containers
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'ENDSSH'
            set -e
            cd /opt/workforce-pulse

            echo "🐳 Building Docker images..."
            docker compose build --no-cache

            echo "🚀 Starting containers..."
            docker compose up -d

            echo "⏳ Waiting for database..."
            sleep 8

            echo "🗄️ Running migrations..."
            docker compose exec -T backend npm run db:migrate

            echo "🌱 Seeding data..."
            docker compose exec -T backend npm run db:seed

            echo "✅ Deployment complete!"
            docker compose ps
          ENDSSH

      - name: Health Check
        run: |
          echo "Waiting for services to be ready..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SERVER_HOST }}/api/health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Notify success
        if: success()
        run: echo "🎉 Workforce Pulse deployed successfully to http://${{ secrets.SERVER_HOST }}"

      - name: Notify failure
        if: failure()
        run: echo "💥 Deployment failed — check logs above"
